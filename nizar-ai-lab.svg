<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Nizar AI Lab</title>
  <desc id="desc">An animated futuristic AI workspace with code, circuits, particles, and a pulsing AI core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#030303"/><stop offset=".52" stop-color="#110905"/><stop offset="1" stop-color="#030303"/></linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd08a"/><stop offset=".35" stop-color="#ff8a22"/><stop offset="1" stop-color="#ff3b00"/></linearGradient>
    <radialGradient id="core"><stop stop-color="#fff4de"/><stop offset=".2" stop-color="#ffad55"/><stop offset=".55" stop-color="#ff5a00"/><stop offset="1" stop-color="#ff3b00" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#ff6b00" stroke-opacity=".08"/></pattern>
    <style>
      .core{animation:core 1.7s ease-in-out infinite alternate;transform-origin:450px 158px}.ring-a{animation:spin 8s linear infinite;transform-origin:450px 158px}.ring-b{animation:spin-reverse 5s linear infinite;transform-origin:450px 158px}.orbit{animation:spin 4.8s linear infinite;transform-origin:450px 158px}.orbit2{animation:spin-reverse 7s linear infinite;transform-origin:450px 158px}.scan{animation:scan 2.6s ease-in-out infinite}.code1{animation:type1 3.2s steps(18) infinite}.code2{animation:type2 3.2s .6s steps(14) infinite}.code3{animation:type3 3.2s 1.1s steps(16) infinite}.wave{stroke-dasharray:12 8;animation:dash 1.2s linear infinite}.float{animation:float 2.5s ease-in-out infinite alternate}.float2{animation:float 3s .7s ease-in-out infinite alternate}.blink{animation:blink 1.4s ease-in-out infinite alternate}
      @keyframes core{to{transform:scale(1.14);opacity:.72}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spin-reverse{to{transform:rotate(-360deg)}}@keyframes scan{0%,100%{transform:translateY(-72px);opacity:.15}50%{transform:translateY(72px);opacity:.9}}@keyframes type1{0%,10%{stroke-dasharray:0 170}65%,100%{stroke-dasharray:170 0}}@keyframes type2{0%,20%{stroke-dasharray:0 125}75%,100%{stroke-dasharray:125 0}}@keyframes type3{0%,30%{stroke-dasharray:0 145}85%,100%{stroke-dasharray:145 0}}@keyframes dash{to{stroke-dashoffset:-40}}@keyframes float{to{transform:translateY(-9px)}}@keyframes blink{to{opacity:.25}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="900" height="320" rx="24" fill="url(#bg)"/><rect width="900" height="320" rx="24" fill="url(#grid)"/><ellipse cx="450" cy="164" rx="210" ry="112" fill="#ff5a00" opacity=".09" filter="url(#blur)"/>
  <g opacity=".5" fill="none" stroke="#ff6b00"><path d="M0 74h100l35 35h94"/><path d="M0 247h118l38-38h72"/><path d="M900 74H800l-35 35h-94"/><path d="M900 247H782l-38-38h-72"/></g>
  <g fill="#ff7a16" filter="url(#glow)"><circle class="blink" cx="100" cy="74" r="3"/><circle class="blink" cx="118" cy="247" r="3"/><circle class="blink" cx="800" cy="74" r="3"/><circle class="blink" cx="782" cy="247" r="3"/></g>
  <g class="float"><rect x="55" y="93" width="248" height="142" rx="15" fill="#0a0a0a" stroke="#ff6b00" stroke-opacity=".65"/><circle cx="76" cy="112" r="4" fill="#ff3b00"/><circle cx="89" cy="112" r="4" fill="#ff8a22"/><circle cx="102" cy="112" r="4" fill="#ffd08a"/><g fill="none" stroke-linecap="round" stroke-width="5"><path class="code1" d="M78 142h101" stroke="#ff6b00"/><path class="code2" d="M94 165h151" stroke="#ffd08a"/><path class="code3" d="M94 188h117" stroke="#ff6b00"/><path class="code2" d="M78 211h76" stroke="#ff3b00"/></g></g>
  <g class="float2"><rect x="597" y="93" width="248" height="142" rx="15" fill="#0a0a0a" stroke="#ff6b00" stroke-opacity=".65"/><text x="721" y="121" fill="#ff8a22" font-family="monospace" font-size="12" text-anchor="middle">NEURAL SIGNAL</text><path class="wave" d="M620 172h25l10-29 16 57 17-79 17 65 14-35 16 21h42l12-25 12 25h20" fill="none" stroke="url(#hot)" stroke-width="4" filter="url(#glow)"/><g fill="#ff6b00"><circle class="blink" cx="628" cy="213" r="3"/><circle class="blink" cx="640" cy="213" r="3"/><circle class="blink" cx="652" cy="213" r="3"/></g></g>
  <g><ellipse class="ring-a" cx="450" cy="158" rx="92" ry="52" fill="none" stroke="#ff6b00" stroke-width="2" stroke-dasharray="9 13"/><ellipse class="ring-b" cx="450" cy="158" rx="64" ry="94" fill="none" stroke="#ff8a22" stroke-width="1.5" stroke-dasharray="4 12" transform="rotate(55 450 158)"/><g class="orbit"><circle cx="542" cy="158" r="7" fill="#ff7a16" filter="url(#glow)"/></g><g class="orbit2"><circle cx="450" cy="64" r="5" fill="#ffd08a" filter="url(#glow)"/></g><circle class="core" cx="450" cy="158" r="48" fill="url(#core)" filter="url(#glow)"/><path d="M427 159l15 15 32-35" fill="none" stroke="#170900" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect class="scan" x="398" y="156" width="104" height="3" rx="2" fill="#ffd08a" filter="url(#glow)"/></g>
  <text x="450" y="286" fill="#ff6b00" font-family="monospace" font-size="15" font-weight="700" letter-spacing="5" text-anchor="middle">NIZAR • AI LAB • ONLINE</text>
</svg>
